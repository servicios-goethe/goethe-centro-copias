<script>
  function inicializarAplicacion() {
    google.script.run
      .withSuccessHandler(function(data) {
        rolActual = data.role;
        appInfoActual = data.appInfo || null;
        listaProductosGlobal = ordenarProductos(data.productos || []);
        renderizarAppInfo_(appInfoActual);
        setupUI(rolActual);
        actualizarVistaProductos();
        prepararFormularioCompras_();
        cargarPanelCopias();
        procesarAccionCopiasDesdeUrl_();
        marcarInitCompleto_();
  
        if (rolActual && rolActual.isAdmin) {
          cargarDashboardAdmin();
        }
      })
      .withFailureHandler(manejarError)
      .getBootstrapData();
  }
  
  function marcarInitCompleto_() {
    initPendiente -= 1;
    if (initPendiente <= 0) {
      ocultarLoading();
    }
  }
  
  function mostrarLoading(mensaje) {
    const loading = document.getElementById("loading");
    loading.querySelector("h3").innerText = mensaje;
    loading.style.display = "flex";
  }
  
  function ocultarLoading() {
    document.getElementById("loading").style.display = "none";
  }

  function renderizarAppInfo_(appInfo) {
    const node = document.getElementById("app-version-info");
    if (!node) return;

    const info = appInfo || {};
    const entorno = String(info.environment || "PRODUCCION").toUpperCase();
    const version = info.version || "sin version";
    const fechaDeploy = info.deployedAtLabel || "sin fecha de deploy";
    const descripcion = info.description ? ` - ${info.description}` : "";

    node.innerText = `${entorno} | GAS ${version} | Deploy ${fechaDeploy}${descripcion}`;
    node.classList.toggle("app-version-dev", entorno !== "PRODUCCION");
    node.classList.toggle("app-version-prod", entorno === "PRODUCCION");
    node.title = node.innerText;
  }
  
  function normalizarMensaje_(mensaje) {
    return String(mensaje || "")
      .replace(/\u00c3\u00a1/g, "a")
      .replace(/\u00c3\u00a9/g, "e")
      .replace(/\u00c3\u00ad/g, "i")
      .replace(/\u00c3\u00b3/g, "o")
      .replace(/\u00c3\u00ba/g, "u")
      .replace(/\u00c3\u00b1/g, "n")
      .replace(/\u00c2\u00bf/g, "?")
      .replace(/\u00c3\u00a4/g, "a")
      .replace(/\u00c3\u00bc/g, "u")
      .replace(/\u00c3/g, "");
  }
  
  function manejarError(error) {
    ocultarLoading();
    const mensaje = error && error.message
      ? normalizarMensaje_(error.message)
      : "Ocurrio un error inesperado. / Unerwarteter Fehler.";
    mostrarAviso("error", mensaje);
  }
  
  function escapeHtml_(valor) {
    return String(valor || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  
  function obtenerProductoPorId(id) {
    return listaProductosGlobal.find(producto => producto.id === String(id));
  }
  
  function obtenerEtiquetaProducto(producto) {
    if (!producto) return "";
    return producto.nombre || [producto.nombreEs, producto.nombreDe].filter(Boolean).join(" / ");
  }

  function obtenerCategoriaProducto_(producto) {
    const categoria = producto && producto.categoria ? String(producto.categoria).trim() : "";
    return categoria || "Sin categoria";
  }

  function ordenarProductosPorCategoria(productos) {
    return [...(productos || [])].sort((a, b) => {
      const categoriaA = obtenerCategoriaProducto_(a).toLocaleLowerCase("es");
      const categoriaB = obtenerCategoriaProducto_(b).toLocaleLowerCase("es");
      const cmpCategoria = categoriaA.localeCompare(categoriaB, "es");
      if (cmpCategoria !== 0) return cmpCategoria;

      const etiquetaA = obtenerEtiquetaProducto(a).toLocaleLowerCase("es");
      const etiquetaB = obtenerEtiquetaProducto(b).toLocaleLowerCase("es");
      return etiquetaA.localeCompare(etiquetaB, "es");
    });
  }

  function renderizarFilasAgrupadasPorCategoria_(productos, renderFila, colspan) {
    let categoriaActual = null;
    return ordenarProductosPorCategoria(productos).map(function(producto) {
      const categoria = obtenerCategoriaProducto_(producto);
      const encabezado = categoria !== categoriaActual
        ? `<tr class="category-row"><td colspan="${colspan}">${escapeHtml_(categoria)}</td></tr>`
        : "";
      categoriaActual = categoria;
      return encabezado + renderFila(producto);
    }).join("");
  }

  function renderizarOpcionesProductoPorCategoria_(productoDefaultId) {
    let categoriaActual = null;
    return ordenarProductosPorCategoria(listaProductosGlobal).map(function(producto) {
      const categoria = obtenerCategoriaProducto_(producto);
      const abreGrupo = categoria !== categoriaActual
        ? `${categoriaActual === null ? "" : "</optgroup>"}<optgroup label="${escapeHtml_(categoria)}">`
        : "";
      categoriaActual = categoria;
      const selected = productoDefaultId === producto.id ? "selected" : "";
      return `${abreGrupo}<option value="${escapeHtml_(producto.id)}" ${selected}>${escapeHtml_(obtenerEtiquetaProducto(producto))}</option>`;
    }).join("") + (categoriaActual === null ? "" : "</optgroup>");
  }
  
  function ordenarProductos(productos) {
    return ordenarProductosPorCategoria(productos);
  }
  
  function normalizarCantidadInput(valor) {
    const numero = parseInt(valor, 10);
    return Number.isFinite(numero) && numero > 0 ? numero : 0;
  }
  
  function crearClaveDomSegura_() {
    return Array.prototype.slice.call(arguments).join("-").replace(/[^a-zA-Z0-9_-]/g, "");
  }
  
  function scrollearA(id) {
    const destino = document.getElementById(id);
    if (destino) {
      destino.scrollIntoView({ behavior: "smooth" });
    }
  }
  
  function aplicarEstadoSecciones_() {
    document.querySelectorAll("[data-section]").forEach(function(elemento) {
      const id = elemento.getAttribute("data-section");
      const contraida = !!seccionesContraidas[id];
      elemento.classList.toggle("is-collapsed", contraida);
  
      const body = elemento.querySelector(`[data-body-for="${id}"]`);
      if (body) {
        body.style.display = contraida ? "none" : "";
      }
  
      const indicador = elemento.querySelector(`[data-indicator-for="${id}"]`);
      if (indicador) {
        indicador.innerText = contraida ? "Expandir" : "Ocultar";
      }
    });
  }
  
  function inicializarSeccionesContraidas_(role) {
    seccionesContraidas = {
      "user-pedido": !!(role && role.isAdmin),
      "user-mis-pedidos": true,
      "admin-pedidos": true,
      "admin-nueva-compra": true,
      "admin-productos": true,
      "admin-recepcion": true,
      "user-copias": true,
      "admin-copias": true,
      "admin-actividad": true
    };
    aplicarEstadoSecciones_();
  }
  
  function toggleSection(id) {
    seccionesContraidas[id] = !seccionesContraidas[id];
    aplicarEstadoSecciones_();
  }
  
  function toggleInstructivo(abrir) {
    const panel = document.getElementById("instructivo-panel");
    const backdrop = document.getElementById("instructivo-backdrop");
    if (!panel || !backdrop) return;
  
    const visible = typeof abrir === "boolean" ? abrir : panel.classList.contains("hidden");
    panel.classList.toggle("hidden", !visible);
    backdrop.classList.toggle("hidden", !visible);
    panel.setAttribute("aria-hidden", visible ? "false" : "true");
  }

  function mostrarAviso(tipo, mensaje) {
    let toast = document.getElementById("toast-global");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "toast-global";
      toast.className = "toast-global hidden";
      document.body.appendChild(toast);
    }

    toast.className = `toast-global toast-${tipo || "info"}`;
    toast.innerText = normalizarMensaje_(mensaje || "");
    window.clearTimeout(toastTimerGlobal);
    toastTimerGlobal = window.setTimeout(function() {
      toast.className = "toast-global hidden";
    }, 3400);
  }

  function cerrarModalAccion_() {
    const backdrop = document.getElementById("accion-modal-backdrop");
    const modal = document.getElementById("accion-modal");
    if (backdrop) backdrop.classList.add("hidden");
    if (modal) modal.classList.add("hidden");
    modalAccionPendiente_ = null;
  }

  function mostrarConfirmacionModal_(mensaje, onConfirm, titulo) {
    const title = document.getElementById("accion-modal-title");
    const copy = document.getElementById("accion-modal-copy");
    const input = document.getElementById("accion-modal-input");
    const inputWrap = document.getElementById("accion-modal-input-wrap");
    const confirm = document.getElementById("accion-modal-confirm");
    const backdrop = document.getElementById("accion-modal-backdrop");
    const modal = document.getElementById("accion-modal");
    if (!title || !copy || !confirm || !backdrop || !modal) return;
    title.innerText = titulo || "Confirmar acción";
    copy.innerText = mensaje || "¿Querés continuar?";
    if (inputWrap) inputWrap.classList.add("hidden");
    if (input) input.value = "";
    confirm.innerText = "Confirmar";
    modalAccionPendiente_ = function() { cerrarModalAccion_(); onConfirm(); };
    backdrop.classList.remove("hidden");
    modal.classList.remove("hidden");
  }

  function mostrarEntradaModal_(mensaje, onSubmit, titulo, placeholder) {
    const title = document.getElementById("accion-modal-title");
    const copy = document.getElementById("accion-modal-copy");
    const input = document.getElementById("accion-modal-input");
    const inputWrap = document.getElementById("accion-modal-input-wrap");
    const confirm = document.getElementById("accion-modal-confirm");
    const backdrop = document.getElementById("accion-modal-backdrop");
    const modal = document.getElementById("accion-modal");
    if (!title || !copy || !input || !inputWrap || !confirm || !backdrop || !modal) return;
    title.innerText = titulo || "Ingresar datos";
    copy.innerText = mensaje || "Completá el dato solicitado.";
    input.value = "";
    input.placeholder = placeholder || "";
    inputWrap.classList.remove("hidden");
    confirm.innerText = "Continuar";
    modalAccionPendiente_ = function() {
      const value = String(input.value || "").trim();
      if (!value) { input.focus(); return; }
      cerrarModalAccion_();
      onSubmit(value);
    };
    backdrop.classList.remove("hidden");
    modal.classList.remove("hidden");
    window.setTimeout(function() { input.focus(); }, 0);
  }

  function confirmarModalAccion_() {
    if (typeof modalAccionPendiente_ === "function") modalAccionPendiente_();
  }
  
  function actualizarStockGlobal() {
    google.script.run
      .withSuccessHandler(function(productos) {
        listaProductosGlobal = ordenarProductos(productos);
  
        actualizarVistaProductos();
        actualizarVistaCompras();
      })
      .withFailureHandler(manejarError)
      .obtenerProductosConStock();
  }
  
  function setupUI(role) {
    const userInfo = document.getElementById("user-info");
    if (userInfo) userInfo.innerText = role.email;
    const avatar = document.getElementById("user-avatar");
    if (avatar) avatar.innerText = obtenerInicialesUsuario_(role.email);
    const roleInfo = document.getElementById("user-role-info");
    if (roleInfo) roleInfo.innerText = obtenerEtiquetaRolRedisenio_(role);
    document.getElementById("view-user").classList.remove("hidden");
    ordenarSeccionesUsuario_(role);
  
    if (!role.isGoethe) {
      document.getElementById("estado-usuario").innerText = "Acceso externo detectado.";
      document.getElementById("estado-usuario").classList.remove("hidden");
    }
  
    if (role.isCuentaGeneral) {
      document.getElementById("general-requester-wrap").classList.remove("hidden");
      document.getElementById("estado-usuario").innerText = "Cuenta general: ingresar nombre y apellido, y mail del solicitante.";
      document.getElementById("estado-usuario").classList.remove("hidden");
      const esTerminalCopias = String(role.email || "").trim().toLowerCase() === "copias@goethemail.net";
      setVisible_("solicitante-busqueda-field", esTerminalCopias);
      const nombreSolicitante = document.getElementById("solicitante-nombre-completo");
      const mailSolicitante = document.getElementById("solicitante-mail");
      if (nombreSolicitante) {
        nombreSolicitante.readOnly = esTerminalCopias;
        nombreSolicitante.placeholder = esTerminalCopias ? "Selecciona una persona" : "Nombre y apellido";
      }
      if (mailSolicitante) {
        mailSolicitante.readOnly = esTerminalCopias;
        mailSolicitante.placeholder = esTerminalCopias ? "El mail se completa automáticamente" : "usuario@goethe.edu.ar";
      }
    }

    if (typeof actualizarVisibilidadStockPedido_ === "function") {
      actualizarVisibilidadStockPedido_();
    }
  
    inicializarSeccionesContraidas_(role);
    aplicarModoOperadorEntrega_(role);
  
    if (role.isAdmin) {
      document.getElementById("view-admin").classList.remove("hidden");
      mostrarPlaceholdersAdmin_();
    } else {
      document.getElementById("admin-resumen").classList.add("hidden");
    }

    renderNavegacionRedisenio_(role);
  }

  function obtenerInicialesUsuario_(email) {
    const local = String(email || "?").split("@")[0].replace(/[._-]+/g, " ").trim();
    const partes = local.split(/\s+/).filter(Boolean);
    return (partes.slice(0, 2).map(function(parte) { return parte.charAt(0); }).join("" ) || "?").toUpperCase();
  }

  function obtenerEtiquetaRolRedisenio_(role) {
    if (role && role.isOperadorEntrega) return "Operador · Operator";
    if (role && role.isAdmin) return "Administrador · Administrator";
    return "Usuario · Benutzer";
  }

  function obtenerConfiguracionNavegacionRedisenio_(role, modulo) {
    const admin = !!(role && role.isAdmin && !role.isOperadorEntrega);
    const operador = !!(role && role.isOperadorEntrega);
    if (modulo === "copias") {
      const tabs = [{ key: "nueva", es: "Nueva solicitud", de: "Neuer Auftrag", panels: ["user-copias"] }, { key: "mis", es: "Mis solicitudes", de: "Meine Aufträge", panels: ["user-copias"] }];
      if (admin) tabs.push({ key: "autorizaciones", es: "Autorizaciones", de: "Freigaben", panels: ["admin-copias"] });
      if (admin || operador) tabs.push({ key: "trabajos", es: "Trabajos", de: "Druckaufträge", panels: ["admin-copias"] });
      return tabs;
    }
    const tabs = [{ key: "nuevo", es: "Nuevo pedido", de: "Neue Anfrage", panels: ["user-pedido"] }, { key: "mis", es: "Mis pedidos", de: "Meine Anfragen", panels: ["user-mis-pedidos"] }];
    if (admin || operador) tabs.push({ key: "entregas", es: "Entregas", de: "Ausgaben", panels: ["admin-pedidos"] });
    if (operador) tabs.push({ key: "ingreso", es: "Ingreso de stock", de: "Wareneingang", panels: ["admin-nueva-compra"] });
    if (admin) {
      tabs.push({ key: "compras", es: "Compras", de: "Einkauf", panels: ["admin-nueva-compra"] });
      tabs.push({ key: "recepcion", es: "Recepción", de: "Wareneingang", panels: ["admin-recepcion"] });
      tabs.push({ key: "productos", es: "Productos y stock", de: "Produkte & Bestand", panels: ["admin-productos", "admin-actividad"] });
    }
    return tabs;
  }

  function renderNavegacionRedisenio_(role) {
    const navigation = document.getElementById("redesign-navigation");
    const tabsNode = document.getElementById("redesign-tabs");
    if (!navigation || !tabsNode) return;
    navigation.classList.remove("hidden");
    try {
      moduloActivo = sessionStorage.getItem("pedidos-grafica-modulo") || "materiales";
      solapaActivaPorModulo.materiales = sessionStorage.getItem("pedidos-grafica-solapa-materiales") || "nuevo";
      solapaActivaPorModulo.copias = sessionStorage.getItem("pedidos-grafica-solapa-copias") || "nueva";
    } catch (error) {}
    const modulos = ["materiales", "copias"];
    modulos.forEach(function(modulo) {
      const button = document.getElementById(`module-${modulo}`);
      if (button) {
        button.classList.toggle("is-active", moduloActivo === modulo);
        button.setAttribute("aria-selected", moduloActivo === modulo ? "true" : "false");
      }
    });
    let tabs = obtenerConfiguracionNavegacionRedisenio_(role, moduloActivo);
    if (!tabs.some(function(tab) { return tab.key === solapaActivaPorModulo[moduloActivo]; })) solapaActivaPorModulo[moduloActivo] = tabs[0].key;
    const activa = solapaActivaPorModulo[moduloActivo];
    tabsNode.innerHTML = tabs.map(function(tab) {
      const selected = tab.key === activa;
      return `<button class="redesign-tab${selected ? " is-active" : ""}" type="button" role="tab" aria-selected="${selected}" onclick="seleccionarSolapaRedisenio_('${moduloActivo}', '${tab.key}')"><strong>${tab.es}</strong><small>${tab.de}</small></button>`;
    }).join("");
    const paneles = new Set();
    tabs.forEach(function(tab) { tab.panels.forEach(function(panel) { paneles.add(panel); }); });
    document.querySelectorAll("[data-section]").forEach(function(node) {
      node.classList.add("redesign-panel-hidden");
    });
    const tabSeleccionada = tabs.find(function(tab) { return tab.key === activa; });
    if (tabSeleccionada) tabSeleccionada.panels.forEach(function(panel) {
      const node = document.querySelector(`[data-section="${panel}"]`);
      if (node && !node.classList.contains("hidden")) {
        node.classList.remove("redesign-panel-hidden", "is-collapsed");
        const body = node.querySelector(`[data-body-for="${panel}"]`);
        if (body) body.style.display = "";
      }
    });
    actualizarSubpanelesCopiasRedisenio_(moduloActivo, activa);
    actualizarFiltroCopiasPorSolapaRedisenio_(moduloActivo, activa);
  }

  function actualizarSubpanelesCopiasRedisenio_(modulo, solapa) {
    const nueva = document.getElementById("copias-nueva-panel");
    const propias = document.getElementById("copias-mis-panel");
    if (!nueva || !propias) return;
    const visible = modulo === "copias";
    nueva.classList.toggle("redesign-panel-hidden", !visible || solapa !== "nueva");
    propias.classList.toggle("redesign-panel-hidden", !visible || solapa !== "mis");
  }

  function actualizarFiltroCopiasPorSolapaRedisenio_(modulo, solapa) {
    const selector = document.getElementById("estado-copias-admin");
    if (!selector) return;
    const estadoForzado = solapa === "autorizaciones" ? "SOLICITADO" : solapa === "trabajos" ? "AUTORIZADO" : "";
    selector.disabled = !!estadoForzado;
    if (estadoForzado) selector.value = estadoForzado;
    if (modulo === "copias" && estadoForzado && typeof renderizarCopiasOperativas_ === "function") renderizarCopiasOperativas_();
  }

  function seleccionarModuloRedisenio_(modulo) {
    moduloActivo = modulo === "copias" ? "copias" : "materiales";
    try { sessionStorage.setItem("pedidos-grafica-modulo", moduloActivo); } catch (error) {}
    renderNavegacionRedisenio_(rolActual);
  }

  function seleccionarSolapaRedisenio_(modulo, solapa) {
    solapaActivaPorModulo[modulo] = solapa;
    try { sessionStorage.setItem(`pedidos-grafica-solapa-${modulo}`, solapa); } catch (error) {}
    renderNavegacionRedisenio_(rolActual);
  }

  function ordenarSeccionesUsuario_(role) {
    const misPedidos = document.getElementById("user-mis-pedidos-section");
    const copias = document.querySelector('[data-section="user-copias"]');
    if (misPedidos && copias) {
      copias.insertAdjacentElement("afterend", misPedidos);
    }

    const esTerminalCopias = String(role && role.email || "").trim().toLowerCase() === "copias@goethemail.net";
    setVisible_("user-mis-pedidos-section", !esTerminalCopias);
  }

  function setVisible_(id, visible) {
    const node = document.getElementById(id);
    if (node) node.classList.toggle("hidden", !visible);
  }

  function setText_(id, text) {
    const node = document.getElementById(id);
    if (node) node.innerText = text;
  }

  function aplicarModoOperadorEntrega_(role) {
    const esOperador = !!(role && role.isOperadorEntrega);
    document.body.classList.toggle("delivery-mode", esOperador);

    if (!esOperador) return;

    setText_("admin-title", "Gestion de pedidos");
    setText_("admin-copy", "Gestiona cantidades y entregas con stock inicial, solicitado y disponible visibles.");
    setText_("compra-section-title", "Ingreso de stock · Wareneingang");
    setText_("compra-section-copy", "La mercadería se suma al stock al instante. · Wird sofort zum Bestand addiert.");
    setText_("btn-enviar-compra", "Registrar ingreso · Eingang buchen");

    setVisible_("admin-nav-productos", false);
    setVisible_("kpi-compras-card", false);
    setVisible_("sec-productos", false);
    setVisible_("sec-recepcion", false);
    setVisible_("sec-actividad", false);
    setVisible_("compra-referencia-header", false);
  }
  
  function renderizarResumenAdmin_() {
    if (!rolActual || !rolActual.isAdmin) return;

    document.getElementById("kpi-pedidos").innerText = String(pedidosAdminActuales.length);
    const comprasKpi = document.getElementById("kpi-compras");
    if (comprasKpi) comprasKpi.innerText = String(comprasAdminActuales.length);

  const pedidosResumen = document.getElementById("admin-pedidos-resumen");
  const recepcionResumen = document.getElementById("admin-recepcion-resumen");
  if (pedidosResumen) {
    const conFaltantes = pedidosAdminActuales.filter(function(pedido) {
      return pedido.items.some(function(item) { return item.faltante > 0; });
    }).length;
    pedidosResumen.innerText = `${pedidosAdminActuales.length} pedidos | ${conFaltantes} con faltantes`;
  }
  if (recepcionResumen) {
    const lotes = {};
    comprasAdminActuales.forEach(function(item) { lotes[item.id] = true; });
    recepcionResumen.innerText = `${Object.keys(lotes).length} lotes | ${comprasAdminActuales.length} lineas`;
  }
}
  
  function mostrarPlaceholdersAdmin_() {
    const pedidos = document.getElementById("lista-pedidos-admin");
    const compras = document.getElementById("lista-compras-pendientes");
    const actividad = document.getElementById("lista-actividad-admin");
  
    if (pedidos) pedidos.innerHTML = '<div class="empty-state">Cargando pedidos...</div>';
    if (compras) compras.innerHTML = '<div class="empty-state">Cargando compras...</div>';
    if (actividad) actividad.innerHTML = '<div class="empty-state">Cargando actividad...</div>';
  }
  
  function cargarDashboardAdmin() {
    google.script.run
      .withSuccessHandler(function(data) {
        pedidosAdminActuales = data && data.pedidos ? data.pedidos : [];
        comprasAdminActuales = data && data.compras ? data.compras : [];
        actividadAdminActual = data && data.actividad ? data.actividad : [];
  
        renderizarResumenAdmin_();
        renderizarPedidosAdmin_();
        renderizarComprasAdmin_();
        renderizarActividadAdminLista_();
        prepararFormularioCompras_();
      })
      .withFailureHandler(manejarError)
      .getAdminDashboardData();
  }

  function actualizarActividadYResumenDesdeOperacion_(actividad) {
    if (Array.isArray(actividad)) {
      actividadAdminActual = actividad;
      renderizarActividadAdminLista_();
    }
    renderizarResumenAdmin_();
  }
</script>
